; Loaded last. The upstream image ships PHP's stock www.conf (dynamic, 5 children),
; which overrides serversideup's PHP_FPM_PM_* variables. Each child takes about
; 115 MB, so cap them for Railway's 0.5 GB plan and free idle children quickly.
[www]
pm = ondemand
pm.max_children = ${PHP_FPM_PM_MAX_CHILDREN}
pm.process_idle_timeout = 20s
pm.max_requests = 500
